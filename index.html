<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مزرعة الصلوات التفاعلية</title>
    <style>
        :root {
            --bg-farm: #eef7f2;
            --primary: #2e7d32;
            --off-gray: #b0bec5;
            --j الجماعة: #4caf50;
            --m-منفرد: #ff9800;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-farm);
            margin: 0;
            padding: 20px;
            color: #333;
            text-align: center;
        }
        header {
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        h1 { color: var(--primary); margin: 0 0 10px 0; }
        .date-info { font-weight: bold; color: #555; }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background: #fff;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: var(--primary);
            color: white;
        }
        .view-content {
            display: none;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .view-content.active { display: block; }
        
        /* View 1: Farm Layout */
        .farm-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 10px;
        }
        .tree-card {
            background: #f9fbf9;
            border: 2px dashed #a5d6a7;
            border-radius: 12px;
            padding: 15px;
            position: relative;
        }
        .tree-title {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 5px;
        }
        .leaves-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .leaf {
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            user-select: none;
            transition: background 0.2s, transform 0.1s;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .leaf:active { transform: scale(0.98); }
        .leaf.state-0 { background-color: var(--off-gray); color: white; }
        .leaf.state-1 { background-color: var(--j-الجماعة); color: white; }
        .leaf.state-2 { background-color: var(--m-منفرد); color: white; }

        /* View 2: Reports */
        .report-section { text-align: right; max-width: 600px; margin: 0 auto; }
        .stats-box {
            display: flex;
            justify-content: space-around;
            background: #f1f8e9;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .stat-item.g { color: var(--j-الجماعة); }
        .stat-item.m { color: var(--m-منفرد); }
        .stat-item.o { color: #757575; }
        .history-list { list-style: none; padding: 0; }
        .history-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        .archive-btn {
            background: #1565c0;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>مزرعة صلواتي التفاعلية 🌳</h1>
        <div class="date-info">الأحد 2 ربيع الآخر 1448 هـ | 13 سبتمبر 2026 م</div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchView('view1')">عرض المزرعة (View 1)</button>
        <button class="tab-btn" onclick="switchView('view2')">التقارير والإحصائيات (View 2)</button>
    </div>

    <!-- View 1: All Trees -->
    <div id="view1" class="view-content active">
        <div class="farm-grid" id="farmGrid"></div>
    </div>

    <!-- View 2: Summary Report -->
    <div id="view2" class="view-content">
        <div class="report-section">
            <h3>مختصر الأداء الحالي</h3>
            <div class="stats-box">
                <div class="stat-item g">جماعة: <span id="statG">0</span></div>
                <div class="stat-item m">منفرد: <span id="statM">0</span></div>
                <div class="stat-item o">لم تصلّى/مطفأة: <span id="statO">35</span></div>
            </div>
            <h3>تفاصيل أيام الأسبوع</h3>
            <ul class="history-list" id="historyList"></ul>
            <button class="archive-btn" onclick="archiveWeek()">ترحيل إلى مجلد "الأسبوع الأول"</button>
        </div>
    </div>

    <script>
        const days = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
        const prayers = ["الفجر", "الظهر", "العصر", "المغرب", "العشاء"];
        
        // تحميل البيانات السابقة أو إنشاء بيانات جديدة
        let farmData = JSON.parse(localStorage.getItem('prayerFarmData')) || {};
        
        // تهيئة البيانات الافتراضية إذا كانت فارغة
        days.forEach(day => {
            if (!farmData[day]) {
                farmData[day] = {};
                prayers.forEach(p => farmData[day][p] = 0); // 0 = OFF, 1 = جماعة, 2 = منفرد
            }
        });

        function saveAndRefresh() {
            localStorage.setItem('prayerFarmData', JSON.stringify(farmData));
            renderFarm();
            renderReports();
        }

        function switchView(viewId) {
            document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            event.target.classList.add('active');
        }

        function toggleLeaf(day, prayer) {
            // دورة الضغط: 0 -> 1 -> 2 -> 0
            farmData[day][prayer] = (farmData[day][prayer] + 1) % 3;
            saveAndRefresh();
        }

        function renderFarm() {
            const grid = document.getElementById('farmGrid');
            grid.innerHTML = '';
            days.forEach(day => {
                let treeHtml = `<div class="tree-card"><div class="tree-title">${day}</div><div class="leaves-container">`;
                prayers.forEach(prayer => {
                    const state = farmData[day][prayer];
                    let stateText = "مطفأة";
                    if(state === 1) stateText = "جماعة";
                    if(state === 2) stateText = "منفرد";
                    treeHtml += `<div class="leaf state-${state}" onclick="toggleLeaf('${day}', '${prayer}')">${prayer} (${stateText})</div>`;
                });
                treeHtml += `</div></div>`;
                grid.innerHTML += treeHtml;
            });
        }

        function renderReports() {
            let totalG = 0, totalM = 0, totalO = 0;
            const list = document.getElementById('historyList');
            list.innerHTML = '';

            days.forEach(day => {
                let dayText = `<strong>${day}:</strong> `;
                let prayerDetails = [];
                prayers.forEach(prayer => {
                    const state = farmData[day][prayer];
                    if(state === 1) { totalG++; prayerDetails.push(`${prayer} (جماعة)`); }
                    else if(state === 2) { totalM++; prayerDetails.push(`${prayer} (منفرد)`); }
                    else { totalO++; prayerDetails.push(`${prayer} (لم تصلى)`); }
                });
                dayText += prayerDetails.join('، ');
                list.innerHTML += `<li class="history-item">${dayText}</li>`;
            });

            document.getElementById('statG').innerText = totalG;
            document.getElementById('statM').innerText = totalM;
            document.getElementById('statO').innerText = totalO;
        }

        function archiveWeek() {
            alert('تم ترحيل وحفظ الأسبوع بنجاح في سجل الأرشيف باسم "الأسبوع الأول" وتم تصفير المزرعة!');
            // تصفير المزرعة للبدء من جديد
            days.forEach(day => { prayers.forEach(p => farmData[day][p] = 0); });
            saveAndRefresh();
        }

        // التشغيل الأول للموقع
        renderFarm();
        renderReports();
    </script>
</body>
</html>
