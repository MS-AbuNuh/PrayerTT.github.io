<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مزرعة الصلوات التفاعلية</title>
    <style>
        :root {
            --bg-farm: #f0f7f4;
            --primary: #2e7d32;
            --off-gray: #cfd8dc;
            --j-جماعة: #4caf50;
            --m-منفرد: #ff9800;
            --trunk: #795548;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-farm);
            margin: 0;
            padding: 15px;
            color: #333;
            text-align: center;
        }
        header {
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.04);
            margin-bottom: 20px;
        }
        h1 { color: var(--primary); margin: 0 0 5px 0; font-size: 24px; }
        .date-info { font-weight: bold; color: #666; font-size: 14px; }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }
        .tab-btn {
            background: #fff;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: var(--primary);
            color: white;
        }
        .view-content {
            display: none;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.04);
        }
        .view-content.active { display: block; }
        
        /* View 1: طابع المزرعة والأشجار الحقيقية */
        .farm-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            padding: 10px;
            background: #e8f5e9;
            border-radius: 15px;
            border: 3px dashed #a5d6a7;
        }
        .tree-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            position: relative;
        }
        /* تاج الشجرة الأخضر الافتراضي الخلفي */
        .tree-crown {
            width: 200px;
            height: 200px;
            background: #c8e6c9;
            border-radius: 50%;
            position: relative;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            gap: 12px;
            padding: 15px;
            box-sizing: border-box;
            box-shadow: inset 0 -10px 0 rgba(0,0,0,0.05), 0 6px 12px rgba(0,0,0,0.05);
            z-index: 2;
        }
        /* جذع الشجرة */
        .tree-trunk {
            width: 24px;
            height: 50px;
            background: var(--trunk);
            border-radius: 0 0 8px 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 1;
            margin-top: -5px;
        }
        .day-label {
            margin-top: 8px;
            font-weight: bold;
            background: var(--primary);
            color: white;
            padding: 4px 15px;
            border-radius: 15px;
            font-size: 14px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }
        
        /* أوراق الشجر التفاعلية الدائرية */
        .leaf {
            width: 46px;
            height: 46px;
            border-radius: 50% 50% 0 50%;
            transform: rotate(-45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .leaf-text {
            transform: rotate(45deg);
            font-size: 11px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
        .leaf.state-0 { background: var(--off-gray); }
        .leaf.state-1 { background: var(--j-جماعة); transform: rotate(-45deg) scale(1.1); }
        .leaf.state-2 { background: var(--m-منفرد); transform: rotate(-45deg) scale(1.1); }

        /* View 2: التقارير */
        .report-section { text-align: right; max-width: 600px; margin: 0 auto; }
        .stats-box {
            display: flex;
            justify-content: space-around;
            background: #f1f8e9;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: bold;
            border: 1px solid #d0e7d2;
        }
        .stat-item.g { color: var(--j-جماعة); }
        .stat-item.m { color: var(--m-منفرد); }
        .stat-item.o { color: #757575; }
        .history-list { list-style: none; padding: 0; }
        .history-item {
            padding: 12px;
            border-bottom: 1px solid #edf2f0;
            font-size: 14px;
            line-height: 1.6;
        }
        .archive-btn {
            background: #1565c0;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 15px;
            width: 100%;
            box-shadow: 0 4px 8px rgba(21, 101, 192, 0.2);
        }
    </style>
</head>
<body>

    <header>
        <h1>مزرعة صلواتي التفاعلية 🌳</h1>
        <div class="date-info">الأحد 2 ربيع الآخر 1448 هـ | 13 سبتمبر 2026 م</div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchView('view1')">عرض المزرعة (View 1)</button>
        <button class="tab-btn" onclick="switchView('view2')">التقارير والإحصائيات (View 2)</button>
    </div>

    <!-- View 1: حقل الأشجار -->
    <div id="view1" class="view-content active">
        <div class="farm-grid" id="farmGrid"></div>
    </div>

    <!-- View 2: التقارير -->
    <div id="view2" class="view-content">
        <div class="report-section">
            <h3>مختصر الأداء الحالي للأسبوع</h3>
            <div class="stats-box">
                <div class="stat-item g">جماعة: <span id="statG">0</span></div>
                <div class="stat-item m">منفرد: <span id="statM">0</span></div>
                <div class="stat-item o">لم تصلّى: <span id="statO">35</span></div>
            </div>
            <h3>سجل الصلوات اليومي</h3>
            <ul class="history-list" id="historyList"></ul>
            <button class="archive-btn" onclick="archiveWeek()">ترحيل إلى مجلد "الأسبوع الأول"</button>
        </div>
    </div>

    <script>
        const days = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
        const prayers = ["فجر", "ظهر", "عصر", "مغرب", "عشاء"];
        
        let farmData = JSON.parse(localStorage.getItem('prayerFarmData')) || {};
        
        days.forEach(day => {
            if (!farmData[day]) {
                farmData[day] = {};
                prayers.forEach(p => farmData[day][p] = 0);
            }
        });

        function saveAndRefresh() {
            localStorage.setItem('prayerFarmData', JSON.stringify(farmData));
            renderFarm();
            renderReports();
        }

        function switchView(viewId) {
            document.querySelectorAll('.view-content').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            event.target.classList.add('active');
        }

        function toggleLeaf(day, prayer) {
            farmData[day][prayer] = (farmData[day][prayer] + 1) % 3;
            saveAndRefresh();
        }

        function renderFarm() {
            const grid = document.getElementById('farmGrid');
            grid.innerHTML = '';
            days.forEach(day => {
                let treeHtml = `
                    <div class="tree-container">
                        <div class="tree-crown">`;
                
                prayers.forEach(prayer => {
                    const state = farmData[day][prayer];
                    treeHtml += `
                        <div class="leaf state-${state}" onclick="toggleLeaf('${day}', '${prayer}')">
                            <span class="leaf-text">${prayer}</span>
                        </div>`;
                });
                
                treeHtml += `
                        </div>
                        <div class="tree-trunk"></div>
                        <div class="day-label">${day}</div>
                    </div>`;
                grid.innerHTML += treeHtml;
            });
        }

        function renderReports() {
            let totalG = 0, totalM = 0, totalO = 0;
            const list = document.getElementById('historyList');
            list.innerHTML = '';

            days.forEach(day => {
                let dayText = `<strong>${day}:</strong> `;
                let prayerDetails = [];
                prayers.forEach(prayer => {
                    const state = farmData[day][prayer];
                    if(state === 1) { totalG++; prayerDetails.push(`${prayer} (جماعة)`); }
                    else if(state === 2) { totalM++; prayerDetails.push(`${prayer} (منفرد)`); }
                    else { totalO++; prayerDetails.push(`${prayer} (لم تصلى)`); }
                });
                dayText += prayerDetails.join('، ');
                list.innerHTML += `<li class="history-item">${dayText}</li>`;
            });

            document.getElementById('statG').innerText = totalG;
            document.getElementById('statM').innerText = totalM;
            document.getElementById('statO').innerText = totalO;}
                function archiveWeek() {
            alert('تم ترحيل وحفظ الأسبوع بنجاح في سجل الأرشيف باسم "الأسبوع الأول" وتم تصفير المزرعة!');
            // تصفير المزرعة للبدء من جديد
            days.forEach(day => { 
                prayers.forEach(p => farmData[day][p] = 0); 
            });
            saveAndRefresh();
        }

        // التشغيل الأول والضروري للموقع لعرض الأشجار والتقارير فور فتح الصفحة
        renderFarm();
        renderReports();
    </script>
</body>
</html>
